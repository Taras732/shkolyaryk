# «Що в завданні?» — проксі до Claude для сторінки /homework застосунку Школярик.
# Секрети (не в цьому файлі!):
#   wrangler secret put DEEPSEEK_API_KEY   — ⚠️ ТИМЧАСОВО ключ Штурмана (07.10.2026); перед продажем — власний ключ Школярика
#   wrangler secret put FAMILY_CODE        — сімейний код, який батьки один раз вводять у застосунку
name = "shkolyaryk-homework"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://shkolyaryk-dev.kuznya.studio,https://shkolyaryk.kuznya.studio,http://localhost:5179"
REPORT_HOUR = "20"

# Вечірній звіт батькам у Telegram: події ігор з пристроїв дітей → KV → щогодинний cron,
# що надсилає підсумок о REPORT_HOUR за Києвом (так перехід на зимовий час не зсуває звіт).
# Секрети: TG_BOT_TOKEN — бот Life OS Тараса (рішення 07.10: звіти через Life OS, не окремий бот);
#          TG_CHAT_ID — група Life OS; TG_THREAD_ID — тема «Школярик» у ній.
# Без TG_CHAT_ID воркер сам бере чат з getUpdates — лише для окремого бота, НЕ для Life OS.
[[kv_namespaces]]
binding = "REPORTS"
id = "e2f104788360456ca80119656ff83643"

[triggers]
crons = ["0 * * * *"]
