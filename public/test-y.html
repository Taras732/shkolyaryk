<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Як звучить И</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F3EEFF; padding: 20px; color: #1F2138; }
  h1 { font-size: 20px; } p { color: #7A7D99; font-weight: 600; }
  button { display: block; width: 100%; max-width: 360px; margin: 10px 0; padding: 16px; border: 0; border-radius: 16px; background: #fff; font-size: 18px; font-weight: 800; text-align: left; box-shadow: 0 4px 12px #0001; cursor: pointer; }
  b { color: #7c3aed; margin-right: 10px; }
</style>
</head>
<body>
  <h1>Як чіткіше звучить «И»?</h1>
  <p>Послухай кожен і скажи літеру. Голос пристрою не використовується — це готові файли.</p>
  <button onclick="new Audio('/audio/test-y/a.mp3').play()"><b>A</b>Поліна · «И.» (зараз у грі)</button>
  <button onclick="new Audio('/audio/test-y/b.mp3').play()"><b>B</b>Поліна · «И-и-и», протяжно</button>
  <button onclick="new Audio('/audio/test-y/e.mp3').play()"><b>C</b>Поліна · «Ии»</button>
  <button onclick="new Audio('/audio/test-y/c.mp3').play()"><b>D</b>Остап (чоловічий) · «И.»</button>
  <button onclick="new Audio('/audio/test-y/d.mp3').play()"><b>E</b>Остап · «И-и-и», протяжно</button>
  <h1 style="margin-top:24px">Друга спроба</h1>
  <p>Український голос знак «ы» вимовити відмовився (порожній файл). Ось що вдалося:</p>
  <button onclick="new Audio('/audio/test-y/j.mp3').play()"><b>J</b>Поліна · «кит, ти, ми» — чи в словах «и» правильна?</button>
  <button onclick="new Audio('/audio/test-y/h.mp3').play()"><b>K</b>російський голос · «ы» — лише для порівняння, в гру не ставимо</button>
</body>
</html>
